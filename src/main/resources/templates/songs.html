<!DOCTYPE html>
<html>
<head>
    <title>Songs</title>
</head>
<body>

<h1>Songs</h1>

<div id="songs"></div>

<script>
    fetch('/api/puppetmaster/songs')
        .then(response => response.json())
        .then(songs => {
            songs.forEach(song => {

                let songHTML = `<div class="Song"><h2>${song.songName}</h2>`

                songHTML += `<div>${song.originalSongName}</div><div>${song.lightType}</div>`
                songHTML += `</div>`;

                document.getElementById("songs").innerHTML += songHTML;
            });
        });
</script>

</body>

<footer><a href = "http://localhost:8080/puppetmaster">Back Home</a></footer>
</html>
